name: SDK tests
on: [push, pull_request]
jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['python:3.6.15-slim-buster', 'python:3.8.20-slim-bookworm', 'python:3.12-slim-bookworm']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install './src[crypto]' wheel
      - run: python -m unittest discover -s tests -v
      - run: python src/setup.py sdist bdist_wheel
